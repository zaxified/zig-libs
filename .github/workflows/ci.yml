name: CI

on:
  push:
    branches: [main]
    # Date tags (see CONVENTIONS §8). A tag is a claim that every lane was
    # green at that commit, so tagging re-runs the full matrix rather than
    # trusting that main was green when the tag was cut.
    # ⚠ BOTH FORMS, because CONVENTIONS §8 and `tag.sh` mint both. A second tag
    # on the same day gets `.1`, `.2`, … so names stay sortable and never
    # collide — and this filter, without the second pattern, could not match
    # one. `2026-08-15.1` was the first such tag ever cut here; it pushed
    # cleanly and started NO run at all, which is the worst shape a tag can
    # have: it asserts every lane was green while no lane ran.
    #
    # A trailing `*` on the first pattern would have covered it and would also
    # have matched `2026-08-15-experiment`. Two explicit patterns say what is
    # meant.
    tags:
      - "20[0-9][0-9]-[0-9][0-9]-[0-9][0-9]"
      - "20[0-9][0-9]-[0-9][0-9]-[0-9][0-9].[0-9]*"
  pull_request:
  # ⭐ THE FULL MATRIX, ON DEMAND, OVER ANY BRANCH — added 2026-08-18, and the
  # reason is a tag that had to be deleted the same day.
  #
  # Until this existed, a tag push was the ONLY event that ran the full matrix.
  # So when `qrscan` failed on the ReleaseFast amd64 lane and passed on every
  # local lane, the only way to observe the failure again — or to observe that a
  # fix had worked — was to mint another tag. A tag ASSERTS every module passed
  # every lane; minting one to find out whether that is true inverts what it
  # means, and each iteration leaves a false claim behind that consumers pin to.
  #
  # `lane` selects ONE entry of the matrix instead of all four, because that is
  # what debugging a single red lane actually needs. Four lanes to re-check one
  # is ~50 runner-minutes for ~12 minutes of answer, and the other three are
  # already known green.
  #
  # ⚠ THE DEFAULT IS `all`, deliberately. A one-lane run is the special case and
  # should be chosen; the dropdown makes that one click. A default of whichever
  # lane happened to be red on the day this was written would have aged into a
  # trap the first time someone ran it expecting the matrix.
  #
  # ⚠ A GREEN DISPATCH RUN IS NOT A TAG-GRADE CLAIM. It may have run one lane
  # over an unmerged branch. The `gate` job says so in its log rather than
  # leaving the tick to be misread — and note that a dispatch ON MAIN also
  # becomes what the README's badge shows, so a green one-lane run there can
  # repaint a badge that a four-lane run had turned red.
  workflow_dispatch:
    inputs:
      lane:
        description: "Which full-matrix lane to run"
        type: choice
        default: all
        options:
          - all
          - checks
          - modules ReleaseSafe amd64
          - modules ReleaseFast amd64
          - modules ReleaseSafe arm64
          - compile-only strict Debug amd64
          - examples ReleaseSafe amd64
          - examples ReleaseFast amd64
          - examples ReleaseSafe arm64
          - interop ReleaseSafe amd64
          - ctgrind amd64

# Least privilege. The gate reads the repository and nothing else — it opens no
# issue, pushes no tag, publishes no package — so saying so here means a
# compromised action in the chain cannot do those things either. Borrowed from
# vercel-labs/native's Zig CI, which declares the same.
permissions:
  contents: read
  # Read-only, for one query: the `scoped` job asks which commit the last
  # GREEN run on main tested, and diffs from there (see "Test changed modules").
  actions: read

# One run per ref, and the superseded one is cancelled. Re-cutting a tag
# happened four times on 2026-08-15 alone, and each time the previous matrix
# kept burning four runners for work whose commit no longer existed — cancelled
# by hand, when it was noticed at all.
#
# ⚠ Deliberately keyed on the REF, not on the workflow alone: a tag run and a
# main-push run test different things and must not cancel each other.
#
# ⚠ AND ON THE EVENT (2026-09-18). A dispatch over `main` has the push's ref,
# so it cancelled the push run it was started beside -- observed on e81bba41.
# That left the commit with no green push run, which is exactly what
# `tag.sh` asks for, while CONVENTIONS §8 recommends that very dispatch right
# before a tag. Two pushes still cancel each other, which stamps make safe:
# the later run finds the earlier commit's modules unstamped and runs them.
concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

# Linux-only: several modules (procnet, rawsock, netlink, wireguard, …) are
# raw-syscall Linux members and are compiled by `zig build test`; socket/netns
# tests SkipZigTest cleanly on a constrained runner.
#
# ⭐ UBUNTU 26.04, PINNED, NOT `ubuntu-latest`. Two reasons, and the second is
# the one that cost real time.
#
# Pinned because `ubuntu-latest` moves under us: the image is the OTHER half of
# every live-interop test in this repository, and a gate whose oracle changes
# without a commit cannot say whether a red lane is our code or the runner's
# week. Bump this line deliberately, the way a dependency is bumped.
#
# 26.04 rather than 24.04 because of what 24.04 shipped. Its `openssh-client` is
# 9.6p1 and `mlkem768x25519-sha256` arrived in OpenSSH 9.9, so both of ssh's
# live post-quantum KEX tests could never run there — one skipped, and the other
# spawned a client that refused the algorithm, exited before connecting, and
# left our `accept` blocked until GitHub killed the job at its six-hour limit.
# That single test is what made the 2026-08-14 and 2026-08-15 matrices
# unfinishable. 26.04 ships 10.2p1, the same version as the development host,
# which both runs those tests for real and removes a whole class of
# passes-locally-fails-in-CI.
#
# ⚠ The corollary is that the runner image is now a DEPENDENCY with a version.
# When a live test starts failing, the image's release notes are the first place
# to look, not the last.
#
# TWO ARCHITECTURES, because the README makes a claim only a second one can
# check. 191 of its 225 catalog rows say Platform `any`, and a consumer reading
# that is entitled to build on aarch64. Until 2026-08-14 every lane ran on
# amd64, so `any` was a claim no job had ever tested.
#
# Three modules make it concrete rather than theoretical. `montint`, `k256` and
# `p256` gate their asm fast path on `builtin.cpu.arch == .x86_64` (see
# `asm_core.zig` / `fast_core.zig`: `pub const supported = ...`), and each
# advertises "amd64 asm + portable fallback". On an amd64 runner the dispatch
# never selects the fallback, so the path every non-amd64 consumer would run was
# the one path no lane exercised.
#
# NOT to be confused with the arm64 question closed on 2026-08-09 (`86cb149`),
# which was about PERFORMANCE -- whether `lockfree`'s seq_cst discipline costs
# anything a weaker ordering would recover. That was answered by measurement on
# TSO and needed no hardware. Portability is a different question and hardware
# is the only thing that answers it.
#
# TWO SHAPES, and the split is the point. (Three EVENTS now reach them.)
#
#   pull_request        -> `test.sh changed`, one lane. Tests every module
#                          with no green stamp at its current fingerprint.
#   push to main        -> the same scoped lane; its repo-wide checks diff
#                          against the last GREEN push, not the previous one.
#   tag                 -> every optimize lane and both architectures, each
#                          `modules`/`examples` lane split into three jobs by
#                          primary lib, each stamp-aware.
#   workflow_dispatch   -> the SAME full shape, over any branch, and optionally
#                          narrowed to one lane. It claims nothing about the
#                          commit; it exists so that reproducing a red lane no
#                          longer requires minting a tag to do it.
#
# THE FULL MATRIX RUNS ON TAGS AND NOT ON EVERY PUSH, decided 2026-08-14 after
# the first run of it took over 95 minutes per lane. A tag is the only thing in
# this repository that CLAIMS every module passed every lane, so it is the thing
# that should pay for the claim; a push to main claims nothing of the sort and
# should not cost six runner-hours to say so. The scoped lane still gates every
# push, and it is minutes.
#
# WHY SCOPING IS SOUND, rather than merely cheaper (rewritten 2026-09-18). A
# module is skipped only when a green stamp exists for this lane at its
# current fingerprint, and the fingerprint folds in the module's code, its
# declaration, the machinery that runs it and every module in its dependency
# closure (`zig build module-fingerprints`). Anything that could change the
# answer changes the key. No stamps at all -- a first run, an expired artifact
# -- means every module runs. Both failure directions are fail-closed.
#
# The shape of the win, measured on the real graph 2026-08-12: the closure is a
# MEDIAN OF ONE MODULE, because most modules have no in-repo consumer at all. It
# reaches a few at the 90th percentile and a few dozen at its worst (`testkit`,
# which half the suite imports). A leaf change therefore costs a small multiple
# of one module's tests against the whole suite.
#
# THREE LANES, and the fourth was dropped on 2026-08-12 with a reason rather
# than a preference. `heavy_optimize` in build.zig substitutes ReleaseSafe for
# Debug on the heavy modules, which makes the old default lane's every
# (module, mode) pair a SUBSET of strict-debug's and ReleaseSafe's — it had no
# combination of its own to prove. Locally that overlap makes it nearly free to
# run after those two, since its artifacts are already built; here, where every
# lane is a separate job with its own cache, it was paying a full build for
# coverage that was already bought.
#
# The three that remain share nothing: each names one mode for every module, so
# no ordering saves a compile. They run in parallel anyway.
#
# THE LANES THEMSELVES are deliberate. Compute-heavy modules build at ReleaseSafe
# when Debug is requested (see `heavy` in build.zig — it takes `bls12_381`, the
# suite's critical path, from minutes to seconds). `-Dstrict-debug` forces it back, keeping
# CONVENTIONS §6.4's "green in Debug and ReleaseFast" honest. Integrators build
# in all three release modes; ReleaseSafe was the only one no lane covered — and
# it earned its place on 2026-08-12 by being the only lane that caught a
# use-after-scope in http's response path that every other lane passed by luck
# (see `ResponseWriter.header_buf`).
#
# They run as separate jobs so the slow one does not gate the fast one.
#
# ⚠ EVERY LANE IS CACHED, and each one measures itself. GitHub allows 10 GB of
# Actions cache PER REPOSITORY and evicts least-recently-used entries above it,
# so whether five lanes fit is an arithmetic question — and until 2026-08-15 it
# was answered with the wrong number.
#
# The retired argument ran: this repo's own `.zig-cache` is tens of GiB, so a
# lane cannot hold a useful fraction and five cannot hold one each. That
# compared a DEVELOPMENT tree against a CI job, and they are not the same
# object. The local one accumulates every optimize mode across every run ever
# made; a lane builds ONE mode, ONCE, into a fresh checkout. The real per-lane
# figure was never measured, and a cache was ruled out on an estimate that
# described something else.
#
# So the lanes cache, and each prints the size of the tree it is about to save
# (see "Report the cache footprint"). Two runs settle it: if the five together
# fit under the quota, this stays; if they evict each other, the logs will say
# so in bytes rather than in argument. A thrashing cache is worse than none —
# it costs the same wall-clock AND the pretence of being warm — so the decision
# needs a number, which is the one thing it has never had.
#
# The keys are per-lane by construction (`cachekey` in the matrix). Matrix jobs
# sharing one key clobber each other on every run; this file already records
# fixing that once, and five caching jobs is precisely when it recurs.
#
# ⚠ A red lane saves NOTHING — `actions/cache` skips its post step when the job
# fails — so the first green run is when any of this starts working, and a
# permanently red lane stays permanently cold.
#
# ⚠ AND THE PR LANE NO LONGER USES setup-zig's CACHE EITHER — it manages
# `.zig-cache` itself through `actions/cache`. Not a preference: measured
# directly — the built-in one persisting ~137 MB of a ~1.1 GB build cache with the
# compiled `o/` outputs dropped, so it restored, reported a hit, and then
# rebuilt everything. A cache that reads as warm and is cold is worse than no
# cache, because nobody goes looking for the time.
#
# That measurement was made in another repository and has NOT been repeated
# here. What is copied is the arrangement, not a verified number: if the PR
# lane's wall-clock does not fall, this is the first thing to re-measure.
#
# The old `cache-key` note applied to setup-zig's cache and is gone with it.
# The same hazard survives in a different spelling: the `key` below must stay
# distinct per caching job, since matrix jobs sharing one key clobber each
# other every run. Today only this job caches, so there is nothing to collide
# with — that stops being true the moment a second one does.
# ⛔⛔ DRY RUN IS ON (2026-09-18). While this says "1", NOTHING in this workflow
# compiles or tests anything: every `scripts/test.sh` step prints what it
# would run and passes, and the peer installs, build caches, root `tc` step
# and example-apps build are skipped. What IS real: module selection,
# fingerprints, stamps (kept under separate `dry-` artifacts with `DRY` in the
# lane key, so they can never stand in for real ones), shards, the plan's
# coverage checks and the gate. It exists to debug this pipeline without a
# 90-minute matrix per attempt. A green run here proves the plumbing and
# NOTHING about the code, and `scripts/tag.sh` refuses to tag while it is on.
# Set it to "0" -- or delete these lines -- to make CI real again.
env:
  ZIGLIBS_DRY_RUN: "1"
  # Volatile stamps (a live peer, or an environment gap that made tests skip)
  # count for 24 hours on pushes and dispatches, and never on a tag: the tag
  # is the claim that every lane passed, so those modules run for real there.
  ZIGLIBS_STRICT_STAMPS: ${{ startsWith(github.ref, 'refs/tags/') && '1' || '0' }}

jobs:
  scoped:
    # ⚠ AND NOT ON A DISPATCH EITHER. A manual run exists to exercise the FULL
    # lanes over a branch; running the scoped one alongside would add a second
    # shape to a run whose whole point is to isolate one, and the `gate` job
    # below requires exactly one shape to have run.
    if: "!startsWith(github.ref, 'refs/tags/') && github.event_name != 'workflow_dispatch'"
    runs-on: ubuntu-26.04
    # A scoped lane is minutes -- unless the build MACHINERY moved (build.zig
    # outside module_list, build.zig.zon, force-pubfn-reach.zig), which re-keys
    # every module in the shard: a cold run of ~75 modules. Since 2026-09-18 a
    # DRIVER change (test.sh, scripts/lib, scripts/checks) re-keys nothing and
    # runs the smoke set instead; see cmd_changed.
    timeout-minutes: 75
    # ⭐ THREE SHARDS, like the full lanes (2026-09-18). On an ordinary push each
    # shard finds most of its modules stamped and is minutes, so the split
    # costs two runner start-ups. It is there for the push that re-keys
    # everything -- any change to the machinery in the fingerprint (build.zig
    # outside module_list, test.sh, ...) -- which on one runner was a cold run
    # of every module against this 75-minute cap. The shard list must cover
    # every primary lib; `plan` checks that for the full lanes, and this list
    # is the same three.
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: crypto
            groups: -Dgroup=crypto
          - shard: net
            groups: -Dgroup=net
          - shard: rest
            groups: -Dgroup=web -Dgroup=format -Dgroup=storage -Dgroup=os
    name: changed modules [${{ matrix.shard }}]
    steps:
      # Full history: `test.sh changed <base>` diffs against the base branch,
      # and a shallow clone has nothing to diff against.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # ⚠ THE ONE ACTION STILL ON NODE 20, and not for want of bumping: v2.2.1
      # is the newest `setup-zig` and its `action.yml` still says `node20`.
      # `checkout` and `cache` were moved to their node24 majors on 2026-08-15;
      # GitHub's deprecation warning will keep naming this one until upstream
      # ships a release that does not. Nothing to do here but know why it stays.
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
          # ⚠ setup-zig's OWN build cache is off on purpose, and not for the
          # quota reason that keeps it off in the `full` job below. Measured
          # directly here: it persisted ~137 MB of a ~1.1 GB build cache and
          # dropped the compiled `o/` outputs — that is, everything the cache
          # exists for. It reads as warm and recompiles from scratch. The Zig
          # TOOLCHAIN download stays cached either way; that part works.
          use-cache: false
      # ⭐ A WEEK IN EVERY BUILD-CACHE KEY (2026-09-18). An entry restores the
      # previous tree, adds to it and saves the whole, and nothing ever
      # deletes: the scoped entry grew 589 -> 646 -> 1156 -> 1364 MB over four
      # pushes (`gh cache list`, 2026-09-18). With the ISO week in the key and
      # in the restore prefix, each week starts from an empty tree and last
      # week's generation ages out of the 10 GB LRU on its own. Cost: the first
      # run of a week is cold.
      - name: Cache generation
        id: gen
        run: echo "week=$(date -u +%GW%V)" >> "$GITHUB_OUTPUT"
      - name: Cache Zig build artifacts
        # Off in a dry run: an almost empty tree saved under the exact key
        # would be restored as a HIT by the first real run, which then saves
        # nothing (an exact hit never saves) -- a cold cache that reads warm.
        if: env.ZIGLIBS_DRY_RUN != '1'
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/.zig-cache
          # Exact key on the sources; restore-keys falls back to the newest
          # prior entry so Zig recompiles only what moved. The `base` token is
          # an epoch: Zig bakes the target and CPU into its own cache key, so an
          # entry built under different build flags can never hit. Bump it
          # (base2, …) when this lane's flags change, to drop the dead entries.
          # `base2` because the lanes moved from Ubuntu 24.04 to 26.04 on
          # 2026-08-15. `runner.os` is "Linux" for both, so without a bump the
          # restore-keys fallback would hand a 26.04 job a cache built against a
          # different glibc and toolchain surface — a hit that is worse than a
          # miss, since it is the kind that reads as warm.
          # `base3` (2026-09-18): the shard and the week joined the key.
          # Per shard: matrix jobs sharing one key clobber each other.
          key: zig-${{ runner.os }}-base3-${{ steps.gen.outputs.week }}-${{ matrix.shard }}-${{ hashFiles('modules/**/*.zig', 'build.zig', 'build.zig.zon') }}
          restore-keys: |
            zig-${{ runner.os }}-base3-${{ steps.gen.outputs.week }}-${{ matrix.shard }}-
      # ⚠ THE SCOPED LANE NEEDS THE PEERS TOO, which it did not have until
      # 2026-08-15. It gates every push, and until this step existed it opened
      # every run with the same six-gap report the `full` job had learned to
      # close — so a push touching `wireguard` or `dtls` was gated by a lane
      # whose privileged and live tests skipped.
      #
      # It is load-bearing: this job can run every module of its shard (a
      # machinery change re-keys them all), and a live module run with its peer
      # missing skips its live tests. Since 2026-09-18 such a module is never
      # stamped (capability_check records the gap), so a failed install here
      # costs a re-run next time rather than a green that lasts.
      - name: Close the environment gaps the gate reports
        if: env.ZIGLIBS_DRY_RUN != '1'
        continue-on-error: true
        # `tests`, not `all`: this job runs `test.sh changed`, which runs tests
        # and examples and never `interop-*`. Since 2026-09-06 the wolfSSL and
        # five-Python-oracle half of that script serves ONLY `zig build
        # interop-<m>` -- the six migrated modules replay committed transcripts
        # and pass on a host with no compiler and no Python -- so installing it
        # here bought the lane that gates every push nothing at all.
        run: bash scripts/lib/ci-environment.sh tests
      # The base differs by event, and a base that does not resolve is NOT
      # allowed to read as "nothing changed": `changed_files` fails and the
      # driver runs `all` rather than passing having tested nothing.
      # ⭐ THE SAME THREE FACTS THE `full` JOB PRINTS, because this lane just
      # produced the question they answer. Two escalated runs of this job, same
      # sources and therefore the same GitHub cache key, one restoring an older
      # generation and the other hitting its primary key EXACTLY:
      #
      #   b58ccac  restore-key fallback   build (all modules)  46.6 s
      #   dfad841  primary key, exact     build (all modules) 482.9 s
      #
      # The exact hit was ten times slower, which cannot be explained by what
      # GitHub restored — it restored more. What Zig then did with it depends on
      # Zig's OWN cache key, and `native` folds a kernel range, a glibc version
      # and a detected CPU into that. GitHub's amd64 pool mixes vendors: on tag
      # 2026-08-15 one lane reported an AMD EPYC 7763 and two an Intel Xeon
      # 8573C, in the same run.
      #
      # That is still a hypothesis. This job runs on every push, so putting the
      # three lines here answers it in days rather than waiting for two warm tags
      # to line up.
      - name: What this runner is
        if: always()
        run: |
          echo "kernel:     $(uname -srm)"
          cpu="$(grep -m1 -E 'model name|Model name' /proc/cpuinfo 2>/dev/null | cut -d: -f2- | xargs)"
          [ -n "$cpu" ] || cpu="$(grep -m1 'CPU part' /proc/cpuinfo 2>/dev/null | cut -d: -f2- | xargs)"
          echo "cpu:        ${cpu:-unknown}"
          echo "zig target: $(zig env 2>/dev/null | grep -m1 '\.target' | cut -d'"' -f2 || echo unknown)"
      # ⭐ STAMPS (2026-09-18): which modules this lane has already proven at
      # their current fingerprint, carried between runs as an artifact -- see
      # scripts/lib/ci-stamps.sh for why an artifact and whose artifacts count.
      # None found = every module runs.
      - name: Fetch this lane's stamps
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/stamps"
          bash scripts/lib/ci-stamps.sh fetch ${{ env.ZIGLIBS_DRY_RUN == '1' && 'dry-' || '' }}stamps-scoped-${{ matrix.shard }}-${{ runner.arch }} "$RUNNER_TEMP/stamps/stamps.tsv"
      - name: Test changed modules
        env:
          ZIGLIBS_LANE: changed modules [${{ matrix.shard }}]
          ZIGLIBS_STAMPS: ${{ runner.temp }}/stamps/stamps.tsv
          GH_TOKEN: ${{ github.token }}
        run: |
          # Same as the `full` job: the imap peer is found at its default path,
          # the opcua one is named by an environment variable.
          export OPCUA_PYTHON="$HOME/.cache/zig-libs-opcua/bin/python3"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="origin/${{ github.base_ref }}"
          else
            # ⭐ FROM THE LAST GREEN PUSH, NOT FROM THE PREVIOUS ONE (2026-09-18).
            # `github.event.before` is the previous push, green or not: push A
            # breaks X and goes red, push B touches only Y, B tests only Y and
            # goes green with X still broken. Diffing from the last commit whose
            # run PASSED covers every commit since, A's included. Same idea as
            # `nrwl/nx-set-shas`. If the lookup fails, or names a commit this
            # clone does not have, the base is the root commit (see below).
            base=$(gh run list --repo "${{ github.repository }}" --workflow ci.yml \
              --branch main --event push --status success --limit 1 \
              --json headSha --jq '.[0].headSha' 2>/dev/null || true)
            if [ -z "$base" ] || ! git rev-parse -q --verify "$base^{commit}" >/dev/null; then
              # Fail CLOSED (audit 2026-09-18): falling back to the previous
              # push reopened the very hole this lookup closes -- a README
              # broken by a red push A, out of push B's diff, never re-checked.
              # The root commit puts every file in the diff, so every check
              # runs; module selection is still by stamps, so this costs the
              # checks, not the matrix.
              base="$(git rev-list --max-parents=0 HEAD | tail -1)"
              echo "::warning::no usable green push run on main -- diffing from the root commit, every check runs"
            fi
            echo "base: $base (last green push on main)"
          fi
          # A pinned CPU level: GitHub's amd64 pool mixes at least four CPU
          # models (znver3, znver4, emeraldrapids, ...), and with `native`
          # every change would have to go green once per model before its
          # stamp holds. x86_64_v3 (AVX2, BMI2) is on all of them; the
          # AVX-512 and ADX paths are the tag's full lanes' to run.
          bash scripts/test.sh changed "$base" -Dcpu=x86_64_v3 ${{ matrix.groups }}
      # Only a green run gets here, and only a push, tag or dispatch shares
      # what it proved; a pull request's stamps would be discarded by the
      # fetch anyway, so it does not upload them.
      - name: Keep this lane's stamps
        if: success() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ZIGLIBS_DRY_RUN == '1' && 'dry-' || '' }}stamps-scoped-${{ matrix.shard }}-${{ runner.arch }}
          path: ${{ runner.temp }}/stamps/stamps.tsv
          if-no-files-found: ignore

  # ⭐ THE LANE TABLE LIVES IN A JOB NOW, not in `strategy.matrix.include`, and
  # `workflow_dispatch`'s `lane` input is why. A job-level `if:` cannot see the
  # `matrix` context — GitHub gives it `github`, `needs`, `vars` and `inputs`
  # and nothing else — so selecting one entry of a matrix means BUILDING that
  # matrix, which is only possible from a job output through `fromJSON`.
  #
  # ⚠ THE OBVIOUS ALTERNATIVE WAS REJECTED FOR A REASON THIS FILE ALREADY KNOWS.
  # Keeping the static matrix and skipping the STEPS of the lanes nobody asked
  # for would leave three jobs reporting `success` having compiled nothing — the
  # same "a tick that means no work happened" shape the `gate` job at the bottom
  # exists to refuse. A lane either runs, or is not in the matrix.
  plan:
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    name: plan lanes
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.lanes.outputs.matrix }}
      selected: ${{ steps.lanes.outputs.selected }}
    steps:
      # ⭐ LANE 0. The sub-second checks run HERE, before the matrix exists,
      # because every other job in this workflow waits on this one's output —
      # so a stray `zig fmt` costs a minute instead of nine runners spending
      # an hour each on work nobody will read. Twelve steps, 4.9 s measured on
      # 2026-08-24; the expensive checks are their own lane, off the critical
      # path. That is the whole trade: 4.9 s serial to save nine runner-hours
      # on the days it fires.
      - uses: actions/checkout@v7
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: The sub-second gates, before anything expensive starts
        run: bash scripts/test.sh checks-fast
      - name: Choose the lanes
        id: lanes
        env:
          # A tag runs everything; only a dispatch can ask for less. `inputs` is
          # empty on a tag push, hence the fallback.
          WANT: ${{ inputs.lane || 'all' }}
        run: |
          set -euo pipefail
          # ⭐ NINE LANES, AND THE SPLIT IS NOT A PREFERENCE. Eight of them
          # came from one split; the ninth (`interop`) is not part of it and is
          # argued for at its own entry. Until 2026-08-24
          # four lanes each ran the WHOLE gate, and the ReleaseFast one cleared
          # its 90-minute cap by 23 SECONDS (5245.8 s of gate under a 5400 s
          # ceiling). The cap is not going up, so the work came apart — and it
          # comes apart cleanly, because the halves share no compilation: a
          # module is compiled once for its test binary and once for its
          # example, and Zig's unit of caching is the whole compilation.
          # Measured: examples cold 2.07 s, examples after the tests 1.80 s;
          # tests cold 23.24 s, tests after the examples 23.44 s. Splitting
          # duplicates nothing; it spreads the same work over idle runners.
          #
          # Measured content of one lane (ReleaseSafe amd64, run 32704842728):
          #   once-only checks     76 s   -> `checks`
          #   check-pubfn-reach    83 s   -> stays per-arch, inside `modules`
          #   examples           1442 s   -> `examples`
          #   modules + tests    2144 s   -> `modules`
          #
          # ⚠ `check-pubfn-reach` is NOT in the `checks` lane. It instantiates
          # every `pub fn` for the target being BUILT, which is exactly how the
          # arm64 lane found x86 inline asm in `montint` on 2026-08-24. Run it
          # once and that class goes unseen on three lanes out of four.
          lanes=()
          # Everything mode- and arch-independent, once for the whole matrix:
          # the tables, the catalog, `check-portable` (which cross-compiles from
          # wherever it runs), the ctgrind harnesses, the sizeprobe.
          lanes+=('{"name":"checks","args":"","cmd":"checks","cachekey":"checks","cache":false,"runner":"ubuntu-26.04","peers":"","tc":false,"timeout":15,"skip_live":""}')
          # ⭐ SHARDED BY PRIMARY LIB, added 2026-09-18. Each `modules` lane
          # and each amd64 `examples` lane is three jobs: `crypto`, `net`, and
          # the other four libs together (75 / 74 / 81 modules). `-Dgroup`
          # narrows `zig build`, `check-pubfn-reach`, `check-examples` and
          # test.sh's module list by `libs[0]` (build.zig, `lane_modules`).
          # Why: compiling is the lane. On the 2026-09-02 tag `build (all
          # modules)` was 2428 s of the 48-minute ReleaseSafe amd64 lane and
          # the tests 213 s, and the A1 campaign has grown both since, against
          # a 90-minute cap. Dependencies in another group are compiled again
          # in each shard that needs them; that is cheap next to the split.
          #
          # ⚠ THE SHARDS OF ONE LANE MUST COVER EVERY MODULE. "Choose the
          # lanes" below checks that per `base`, against module-graph, so a new
          # primary lib fails this job instead of going untested.
          #
          # ⚠ `tc` is true on the `net` shard only: tc is a `net` module and
          # the root step tests just it, so the other shards would repeat it.
          lanes+=('{"name":"modules ReleaseSafe amd64 [crypto]","base":"modules ReleaseSafe amd64","args":"-Doptimize=ReleaseSafe -Dgroup=crypto","cmd":"modules","cachekey":"mod-relsafe-crypto","cache":true,"runner":"ubuntu-26.04","peers":"tests","tc":false,"timeout":90,"skip_live":""}')
          lanes+=('{"name":"modules ReleaseSafe amd64 [net]","base":"modules ReleaseSafe amd64","args":"-Doptimize=ReleaseSafe -Dgroup=net","cmd":"modules","cachekey":"mod-relsafe-net","cache":true,"runner":"ubuntu-26.04","peers":"tests","tc":true,"timeout":90,"skip_live":""}')
          lanes+=('{"name":"modules ReleaseSafe amd64 [rest]","base":"modules ReleaseSafe amd64","args":"-Doptimize=ReleaseSafe -Dgroup=web -Dgroup=format -Dgroup=storage -Dgroup=os","cmd":"modules","cachekey":"mod-relsafe-rest","cache":true,"runner":"ubuntu-26.04","peers":"tests","tc":false,"timeout":90,"skip_live":""}')
          lanes+=('{"name":"modules ReleaseFast amd64 [crypto]","base":"modules ReleaseFast amd64","args":"-Doptimize=ReleaseFast -Dgroup=crypto","cmd":"modules","cachekey":"mod-relfast-crypto","cache":true,"runner":"ubuntu-26.04","peers":"tests","tc":false,"timeout":90,"skip_live":""}')
          lanes+=('{"name":"modules ReleaseFast amd64 [net]","base":"modules ReleaseFast amd64","args":"-Doptimize=ReleaseFast -Dgroup=net","cmd":"modules","cachekey":"mod-relfast-net","cache":true,"runner":"ubuntu-26.04","peers":"tests","tc":true,"timeout":90,"skip_live":""}')
          lanes+=('{"name":"modules ReleaseFast amd64 [rest]","base":"modules ReleaseFast amd64","args":"-Doptimize=ReleaseFast -Dgroup=web -Dgroup=format -Dgroup=storage -Dgroup=os","cmd":"modules","cachekey":"mod-relfast-rest","cache":true,"runner":"ubuntu-26.04","peers":"tests","tc":false,"timeout":90,"skip_live":""}')
          # ONE arm64 pair, not three. What a second architecture buys is
          # portability coverage -- alignment and endianness assumptions,
          # atomics, and the asm-vs-fallback dispatch -- and none of that varies
          # by optimize mode, so the other modes would mostly recompile the same
          # surface. ReleaseSafe is the mode chosen because it is the one that
          # has already caught a real defect here. The day this lane fails
          # something the amd64 ReleaseSafe lane passes, add the others rather
          # than arguing about it.
          #
          # ⚠ ITS cachekey CARRIES NO ARCHITECTURE. The arch is in the key
          # template already (see the cache step), and carrying it here as well
          # is what made this entry's key an extension of the amd64 lane's
          # restore prefix — which is how an amd64 job came to restore an
          # aarch64 object tree.
          #
          # ⚠ `skip_live` exists for exactly one peer. open62541 publishes no
          # arm64 image, so `opcua`'s container runs EMULATED here: 565.8 s
          # against 56.9 s on amd64 on 2026-08-24, for a suite that skips 7 of
          # its own tests on that host anyway. "Our client interoperates with
          # open62541" is not an architecture-dependent claim, and amd64 makes
          # it in a minute. The skip prints a line every time it happens.
          lanes+=('{"name":"modules ReleaseSafe arm64 [crypto]","base":"modules ReleaseSafe arm64","args":"-Doptimize=ReleaseSafe -Dgroup=crypto","cmd":"modules","cachekey":"mod-relsafe-crypto","cache":true,"runner":"ubuntu-26.04-arm","peers":"tests","tc":false,"timeout":90,"skip_live":"opcua"}')
          lanes+=('{"name":"modules ReleaseSafe arm64 [net]","base":"modules ReleaseSafe arm64","args":"-Doptimize=ReleaseSafe -Dgroup=net","cmd":"modules","cachekey":"mod-relsafe-net","cache":true,"runner":"ubuntu-26.04-arm","peers":"tests","tc":true,"timeout":90,"skip_live":"opcua"}')
          lanes+=('{"name":"modules ReleaseSafe arm64 [rest]","base":"modules ReleaseSafe arm64","args":"-Doptimize=ReleaseSafe -Dgroup=web -Dgroup=format -Dgroup=storage -Dgroup=os","cmd":"modules","cachekey":"mod-relsafe-rest","cache":true,"runner":"ubuntu-26.04-arm","peers":"tests","tc":false,"timeout":90,"skip_live":"opcua"}')
          # ⚠ `build`, NOT `modules` — this lane COMPILES every module and every
          # example in real Debug and RUNS NOTHING, and that is the whole claim
          # it can support. Nobody consumes this collection in Debug: it ships
          # source, and the mode is the integrator's decision. What is worth
          # asking of Debug is that the code compiles there, which is a live
          # question, because an integrator developing against these modules
          # does build them in Debug -- heavy ones included, and this is the only
          # lane that ever compiles those in real Debug at all.
          #
          # Running the tests here proved nothing measurable. Debug and
          # ReleaseSafe arm the same safety checks; Debug merely does not
          # optimise, which makes it weaker at exposing UB, and the one
          # documented cross-mode catch went the other way. Tests that run only
          # in Debug: zero. Tests that SKIP in Debug: fifteen. See `cmd_build`
          # in scripts/test.sh.
          lanes+=('{"name":"compile-only strict Debug amd64","args":"-Dstrict-debug","cmd":"build","cachekey":"strictdebug","cache":false,"runner":"ubuntu-26.04","peers":"","tc":false,"timeout":30,"skip_live":""}')
          # BOTH release modes run the examples, and that is deliberate: the two
          # catch different classes and both are documented here. ReleaseFast is
          # where `qrscan`'s uninitialised perspective terms showed (Debug and
          # ReleaseSafe fill `undefined` with 0xaa, which read as a float is
          # near enough to zero to pass every downstream check) and where a
          # `std.debug.assert` guard compiles out and puts two headers on the
          # wire. ReleaseSafe is where a use-after-scope in http's response path
          # showed while both other modes passed it by luck. An example is a
          # real consumer binary, so it is where those classes surface.
          #
          # arm64 runs them too: aarch64 has a weaker memory model than x86, and
          # a store-store reordering bug in `workerpool`/`jobqueue`/`lockfree`
          # can only appear by RUNNING there. No such defect is on record here
          # yet; the lane costs a runner, not wall-clock.
          #
          # ⭐ CACHED, LIKE EVERY OTHER LANE, and the number that settles it was
          # measured the same day this file was split. An EXACT key hit (2834 MB
          # restored) took `build (all modules)` from 1944.2 s to 326.9 s and
          # the whole lane from 3768.9 s to 964.0 s. Warm is worth four fifths
          # of a lane, so no lane gives it up voluntarily.
          #
          # ⚠ WHAT DECIDES WHETHER IT HITS is not the mode, it is the REF. The
          # full matrix runs on tags and dispatch; GitHub scopes cache entries
          # by ref and lets any ref read the DEFAULT branch's. So a tag run hits
          # exactly when a run over `main` has already written that key -- which
          # is why the 2026-08-24 tag was warm (the dispatch an hour earlier
          # wrote it, and the pin commit changed nothing `hashFiles` looks at)
          # while the dispatch itself was stone cold on three lanes out of four.
          # Populate over `main` before tagging, or expect the cold numbers.
          #
          # ⚠ AND A STALE HIT IS NOT A WARM ONE. On the same day a restore-key
          # fallback onto a six-day-old entry left `build (all modules)` at
          # 2598 s -- slower than the cold lane beside it.
          #
          # ⚠ THE QUOTA IS 10 GB PER REPO, LRU. Six caching lanes at 1-3 GB do not all
          # fit, so entries evict each other and a lane going cold is normal
          # rather than a defect. That is survivable only because the lanes are
          # split: a cold `modules` lane is ~50 minutes against a 90-minute cap,
          # where the unsplit lane cleared it by 23 seconds.
          lanes+=('{"name":"examples ReleaseSafe amd64 [crypto]","base":"examples ReleaseSafe amd64","args":"-Doptimize=ReleaseSafe -Dgroup=crypto","cmd":"examples","cachekey":"ex-relsafe-crypto","cache":true,"runner":"ubuntu-26.04","peers":"tests","tc":false,"timeout":60,"skip_live":""}')
          lanes+=('{"name":"examples ReleaseSafe amd64 [net]","base":"examples ReleaseSafe amd64","args":"-Doptimize=ReleaseSafe -Dgroup=net","cmd":"examples","cachekey":"ex-relsafe-net","cache":true,"runner":"ubuntu-26.04","peers":"tests","tc":false,"timeout":60,"skip_live":""}')
          lanes+=('{"name":"examples ReleaseSafe amd64 [rest]","base":"examples ReleaseSafe amd64","args":"-Doptimize=ReleaseSafe -Dgroup=web -Dgroup=format -Dgroup=storage -Dgroup=os","cmd":"examples","cachekey":"ex-relsafe-rest","cache":true,"runner":"ubuntu-26.04","peers":"tests","tc":false,"timeout":60,"skip_live":""}')
          lanes+=('{"name":"examples ReleaseFast amd64 [crypto]","base":"examples ReleaseFast amd64","args":"-Doptimize=ReleaseFast -Dgroup=crypto","cmd":"examples","cachekey":"ex-relfast-crypto","cache":true,"runner":"ubuntu-26.04","peers":"tests","tc":false,"timeout":60,"skip_live":""}')
          lanes+=('{"name":"examples ReleaseFast amd64 [net]","base":"examples ReleaseFast amd64","args":"-Doptimize=ReleaseFast -Dgroup=net","cmd":"examples","cachekey":"ex-relfast-net","cache":true,"runner":"ubuntu-26.04","peers":"tests","tc":false,"timeout":60,"skip_live":""}')
          lanes+=('{"name":"examples ReleaseFast amd64 [rest]","base":"examples ReleaseFast amd64","args":"-Doptimize=ReleaseFast -Dgroup=web -Dgroup=format -Dgroup=storage -Dgroup=os","cmd":"examples","cachekey":"ex-relfast-rest","cache":true,"runner":"ubuntu-26.04","peers":"tests","tc":false,"timeout":60,"skip_live":""}')
          lanes+=('{"name":"examples ReleaseSafe arm64","args":"-Doptimize=ReleaseSafe","cmd":"examples","cachekey":"ex-relsafe-all","cache":true,"runner":"ubuntu-26.04-arm","peers":"tests","tc":false,"timeout":60,"skip_live":""}')
          # ⭐ THE ONE LANE THAT RE-TAKES THE ANCHORS, added 2026-09-06 —
          # and until it existed, NOTHING anywhere ran `zig build interop-<m>`.
          # The migration that day moved six interop programs out of the modules
          # and turned their evidence into committed transcripts the modules
          # replay hermetically. That is the right shape and it costs one thing:
          # replay proves we still agree with what the peer said LAST time. It
          # cannot find that something NEW we send provokes a different
          # reaction, or that the peer moved. Only running the peer does — and
          # for the days in between, the peers were being INSTALLED on lanes
          # that no longer touched them while the six programs that needed them
          # ran nowhere.
          #
          # ⚠ A transcript nobody can re-take is a frozen anchor. `dnssec` lost
          # one exactly that way — its oracle vectors credited two scratchpad
          # paths that are not in this repository — and `gen-dnssec-oracle.sh`
          # had to be written from nothing to get it back. Six transcripts
          # landed on 2026-09-06; this lane is what keeps them re-takeable.
          #
          # PRE-RELEASE, WHICH IS WHAT THIS MATRIX ALREADY IS. `plan` runs on
          # tags and dispatch only, so a lane here is exactly the "pre-release
          # check rather than a per-commit one" the migration asked for. Putting
          # it on every push would restore the cost the migration removed: a
          # container, a C compiler and four pip installs on the critical path.
          #
          # ⚠ IT VERIFIES, IT DOES NOT REWRITE. Each program compares against
          # the committed transcript and reports mismatches; re-blessing is a
          # flag a human passes. So this lane leaves a clean tree and goes RED
          # on divergence, which is the only shape a gate can have.
          #
          # Measured 2026-09-06 on a loaded development box, warm: check-interop
          # 0.2 s, then brotli 3.2 s, dtls 2.0 s, grpc 3.2 s, jinja 0.8 s,
          # poseidon 14.4 s, protobuf 7.5 s — 35 s for all six. Cold is a
          # compile of those six modules plus their programs, nowhere near a
          # `modules` lane, hence 30 minutes rather than 90.
          #
          # ⚠ NO CACHE ENTRY OF ITS OWN, deliberately. The repo-wide quota is
          # 10 GB LRU and six caching lanes at 1-3 GB already evict each other; a
          # ninth key to save a compile this small would make the lanes that
          # need it colder.
          #
          # ⚠ amd64 ONLY. Interop asks whether our bytes and a third party's
          # agree, which is not an architecture-dependent claim — the same
          # reasoning `skip_live` uses for opcua's emulated container.
          lanes+=('{"name":"interop ReleaseSafe amd64","args":"-Doptimize=ReleaseSafe","cmd":"interop","cachekey":"interop","cache":false,"runner":"ubuntu-26.04","peers":"interop","tc":false,"timeout":30,"skip_live":""}')

          # ⭐ THE CONSTANT-TIME MEASUREMENT, added 2026-09-08 (audit R14/1).
          # `check-ctgrind` in the `checks` lane only COMPILES the harnesses --
          # it says so, and that is right for a lane that must pass on a host
          # with no valgrind. But it meant nothing in this workflow ever ran
          # `scripts/checks/ctgrind.sh --check`, so 20 pinned constant-time rows across
          # 8 crypto modules were verified by nothing at all. A harness can
          # build perfectly and report a leak.
          #
          # ⚠ NO `args`, and that is deliberate: the optimize mode of each row
          # is the CLAIM, fixed per (module, target) in ctgrind.sh's MODES
          # table (18 rows ReleaseFast, 2 ReleaseSafe). A lane passing
          # `-Doptimize=` would silently move the measurement off the mode the
          # SPEC states it in.
          #
          # ⚠ amd64 ONLY, like interop: every row's pattern and count was taken
          # on x86_64, and `k256`/`montint` measure inline asm cores that exist
          # only there. An arm64 row would need its own pins, not a re-run.
          #
          # `cache:false` and `timeout:30` follow interop: it builds 8 harnesses
          # in two modes with and without `-fvalgrind`, then runs 60 memcheck
          # processes. Measured 310 s warm for the full check on an i7-7920HQ;
          # 30 minutes is the "this is stuck" line, not the expected cost.
          lanes+=('{"name":"ctgrind amd64","args":"","cmd":"ctgrind","cachekey":"ctgrind","cache":false,"runner":"ubuntu-26.04","peers":"ctgrind","tc":false,"timeout":30,"skip_live":""}')

          # Every shard set must cover the whole collection: per `base`, the
          # union of its `-Dgroup=` values must equal every primary lib in
          # module-graph (column 6). Lanes without `base` are not sharded.
          all_groups=$(zig build module-graph | cut -f6 | sort -u | paste -sd' ')
          while IFS= read -r base; do
            have=$(printf '%s\n' "${lanes[@]}" | jq -r --arg b "$base" 'select(.base == $b) | .args' |
              grep -oE -- '-Dgroup=[^ ]+' | sed 's/-Dgroup=//' | sort -u | paste -sd' ')
            if [ "$have" != "$all_groups" ]; then
              echo "::error::shards of '$base' cover groups [$have], module-graph has [$all_groups]"
              exit 1
            fi
          done < <(printf '%s\n' "${lanes[@]}" | jq -r 'select(.base != null) | .base' | sort -u)
          # A dispatch may name a whole lane (`base`, every shard) or one shard.
          sel=$(printf '%s\n' "${lanes[@]}" | jq -s -c --arg want "$WANT" \
            '[ .[] | select($want == "all" or .name == $want or .base == $want) ]')
          n=$(printf '%s' "$sel" | jq 'length')
          # An input matching nothing must not read as "nothing to do". The
          # `choice` type makes a typo unlikely from the UI, but the API accepts
          # arbitrary strings for a dispatch, and an empty matrix produces a
          # SKIPPED `full` job — which the gate would then have to interpret.
          if [ "$n" -eq 0 ]; then
            echo "::error::no lane named '$WANT'; known lanes:"
            printf '%s\n' "${lanes[@]}" | jq -r '"  - " + .name'
            exit 1
          fi
          names=$(printf '%s' "$sel" | jq -r '[.[].name] | join(", ")')
          echo "requested: $WANT"
          echo "running $n lane(s): $names"
          echo "matrix={\"include\":$sel}" >> "$GITHUB_OUTPUT"
          echo "selected=$names" >> "$GITHUB_OUTPUT"

  full:
    # No `if:` of its own: a job whose `needs` was skipped is skipped too, so
    # `plan`'s condition is the single place the full shape is routed.
    needs: plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    # ⭐ A CEILING WE CHOOSE, instead of the one GitHub imposes. Twice — on
    # 2026-08-14 and again on 2026-08-15 — a single wedged test held every lane
    # open until the six-hour job limit killed it, burning about twenty
    # runner-hours per matrix to learn nothing. The first finished matrix took
    # 48 minutes wall-clock, so 90 is generous for a cold cache on either
    # architecture and still fails in a tenth of the time a runaway used to.
    #
    # ⚠ This does NOT replace `--test-timeout` in the gate, and must not be
    # thought of as doing so. A job timeout says "something here never
    # finished"; the per-test deadline says WHICH test. The first is a
    # backstop, the second is a diagnosis.
    #
    # ⭐ PER LANE SINCE 2026-08-24, because the lanes are no longer the same
    # size. 90 stays for the `modules` lanes -- the ReleaseFast one measured
    # 5245.8 s while it still carried the examples, and 90 is not going up.
    # A `checks` lane that has not finished in 15 minutes is stuck, and saying
    # so in 15 rather than 90 is a large part of why it was split out.
    timeout-minutes: ${{ matrix.timeout }}
    steps:
      - uses: actions/checkout@v7
      # ⚠ THE ONE ACTION STILL ON NODE 20, and not for want of bumping: v2.2.1
      # is the newest `setup-zig` and its `action.yml` still says `node20`.
      # `checkout` and `cache` were moved to their node24 majors on 2026-08-15;
      # GitHub's deprecation warning will keep naming this one until upstream
      # ships a release that does not. Nothing to do here but know why it stays.
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
          # setup-zig's own build cache stays off here for the same reason as
          # in the scoped job: measured dropping the compiled `o/`
          # outputs. The toolchain download is still cached by it.
          use-cache: false
      # Weekly cache generation, as in the scoped job -- see there.
      - name: Cache generation
        id: gen
        run: echo "week=$(date -u +%GW%V)" >> "$GITHUB_OUTPUT"
      - name: Cache Zig build artifacts
        # ⚠ OFF FOR THE DEBUG LANE, and the measurement is why. One cold run
        # each, 2026-08-15:
        #
        #   lane                 tree     saved     lane total
        #   strict Debug         4.0 GB   706 MB      271 s
        #   ReleaseSafe arm64    2.7 GB   687 MB     2003 s
        #   ReleaseSafe          2.9 GB   733 MB     2681 s
        #   ReleaseFast          3.1 GB   756 MB     3038 s
        #
        # The Debug lane holds the LARGEST tree — 225 unoptimised objects — and
        # is by an order of magnitude the CHEAPEST to rebuild, because it only
        # compiles and runs no test. Caching it would spend a quarter of the
        # repository's quota to save about three minutes on a four-minute job,
        # while the lanes that take 33 to 51 minutes compete for the remainder.
        # Those three are 87-89 % compile by wall-clock, which is precisely what
        # a build cache is for.
        if: matrix.cache && env.ZIGLIBS_DRY_RUN != '1'
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/.zig-cache
          # ⚠ `matrix.cachekey` is load-bearing. Each lane compiles EVERY module
          # in ONE optimize mode, so the four trees share nothing; on a single
          # key they would overwrite each other every run and every lane would
          # restore someone else's mode. This file already records that bug
          # once, under setup-zig's `cache-key`.
          #
          # ⭐⭐ AND DISTINCT NAMES ARE NOT ENOUGH — THEY MUST NOT BE PREFIXES OF
          # EACH OTHER, which is a different rule and cost 42 minutes before it
          # was noticed. `restore-keys` matches by PREFIX and returns the most
          # recent entry that matches. The keys were `relsafe` and
          # `relsafe-arm64`, so `zig-full-relsafe-` matched the ARM64 lane's
          # entry, and on tag 2026-08-15 the amd64 ReleaseSafe lane restored an
          # aarch64 object tree:
          #
          #   Cache hit for restore-key: zig-full-relsafe-arm64-d9ef…
          #
          # Nothing was corrupt and nothing failed; the artifacts were simply for
          # another architecture, so Zig rebuilt all 225 modules. That lane
          # compiled for 2540 s while ReleaseFast — same runner image, same
          # kernel, same CPU, same resolved target, its own uncontested key —
          # compiled in 91 s. Both figures are in the same run's logs.
          #
          # ⚠ THIS REFUTES WHAT THIS FILE SAID ONE COMMIT AGO. The amd64 lanes
          # were rebuilding despite a restore, and the explanation offered was
          # that `native` bakes a kernel range, a glibc version and a CPU model
          # into Zig's cache key while GitHub's amd64 pool is heterogeneous. The
          # diagnostics added to prove it disproved it instead: both amd64 lanes
          # report Linux 7.0.0-1011-azure, an AMD EPYC 7763, and
          # x86_64-linux.7.0...7.0-gnu.2.43 — identical, and one of them was
          # fast. A guess that survives because nobody measured it is worse than
          # no guess, which is why that step prints three lines it does not use.
          #
          # The arch is therefore part of the key for EVERY lane, not a suffix on
          # one of them: `relsafe-X64-` and `relsafe-ARM64-` cannot be prefixes
          # of one another, whereas `relsafe-` was a prefix of `relsafe-arm64-`.
          # Adding a lane means checking that its key is not a prefix of any
          # other, and no longer merely that it differs.
          #
          # ⛔ AND WHOEVER CHANGES THE SHAPE OF A KEY MUST DELETE THE OLD
          # ENTRIES. An orphaned cache does not clean itself up — it simply
          # stops being reachable while still counting against the repository's
          # 10 GB, so a rename pays for both generations at once.
          #
          # Fixing the collision above did exactly that, and by the same evening
          # this repository was at 9.53 GB with 6.01 GB of it unreachable: two
          # generations under `zig-full-relsafe-`, `zig-full-relfast-` and
          # `zig-full-relsafe-arm64-` that no `restore-keys` prefix would ever
          # look for again. With ~480 MB of headroom left, every save evicted
          # something, LRU took the least recently used — which between pushes
          # is the scoped lane's entry — and a lane whose key was present an
          # hour earlier missed it.
          #
          #     gh cache list                      # what is actually stored
          #     gh cache delete '<old-key>'        # per entry; there is no glob
          #
          # Deleting the six brought it to 3.53 GB. Nothing was lost: a build
          # cache regenerates, and these were already unreachable by design.
          key: zig-full-${{ matrix.cachekey }}-${{ runner.arch }}-${{ steps.gen.outputs.week }}-${{ hashFiles('modules/**/*.zig', 'build.zig', 'build.zig.zon') }}
          restore-keys: |
            zig-full-${{ matrix.cachekey }}-${{ runner.arch }}-${{ steps.gen.outputs.week }}-
      # scripts/test.sh runs the lane's command over its shard -- every module
      # without a green stamp for this lane, checks included -- and wraps the
      # netlink-writing modules in `unshare -rn` where the runner allows it —
      # otherwise those tests skip rather than fight the runner's own network
      # state. It also prints a capability report naming anything the runner
      # cannot do, so a lane that silently covers less than it looks like is
      # visible in the log.
      #
      # ⚠ NO WALL-CLOCK FIGURE BELONGS IN THIS FILE. Not "none is known yet" —
      # none belongs. A duration here is a number nobody re-measures and every
      # reader believes: this file carried a ~1170 s figure that had never been
      # rechecked, and the three that briefly replaced it were confounded by
      # cache state and could not be compared with each other anyway. The run
      # log is the measurement, it is per-lane and dated, and it costs nothing
      # to look at. Read it there.
      - name: Close the environment gaps the gate reports
        # ⚠ NOT on the compile-only lane, nor on `checks`. Every one of these
        # installs exists to let something REACH a real peer, and those two
        # lanes run nothing. Measured on 2026-08-15: 26 s of a 271 s lane spent
        # installing things nothing would touch.
        # ⚠ KEYED ON WHETHER THE LANE RUNS ANYTHING, not on which lane it is.
        # The compile-only lane died on error.PythonPeerFailed on 2026-08-24
        # under the old spelling of this condition, because it was running
        # examples it had declared it would not run. `peers` says what the lane
        # needs; the lane table says whether it runs anything at all.
        # ⭐ AND KEYED ON WHICH PEERS, not only on whether. Since 2026-09-06 the
        # script takes a ROLE: `tests` is what a lane that runs tests or
        # examples needs (the two sysctls, the yaml corpus, opcua's container
        # and its asyncua venv, imap's pymap, the websocket example's judge);
        # `interop` is the C-compiler/wolfSSL and four-Python-oracle set that
        # ONLY `zig build interop-<m>` reaches. A lane declares what it will
        # actually use, and an empty string still reads as false here.
        if: matrix.peers && env.ZIGLIBS_DRY_RUN != '1'
        # ⚠ SHARED WITH THE `scoped` JOB, deliberately. This was inline here
        # until 2026-08-15, which is precisely why the lane that gates every
        # push had none of it. Two copies of an install list drift; one script
        # that both jobs run cannot.
        continue-on-error: true
        run: bash scripts/lib/ci-environment.sh ${{ matrix.peers }}
      # ⭐ STAMPS (2026-09-18): which modules this lane has already proven at
      # their current fingerprint, carried between runs as an artifact -- see
      # scripts/lib/ci-stamps.sh for why an artifact and whose artifacts count.
      # None found = every module runs.
      - name: Fetch this lane's stamps
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/stamps"
          bash scripts/lib/ci-stamps.sh fetch ${{ env.ZIGLIBS_DRY_RUN == '1' && 'dry-' || '' }}stamps-full-${{ matrix.cachekey }}-${{ runner.arch }} "$RUNNER_TEMP/stamps/stamps.tsv"
      - name: Test (${{ matrix.name }})
        env:
          ZIGLIBS_STAMPS: ${{ runner.temp }}/stamps/stamps.tsv
          # Names this lane's block on the run's summary page, where the lane
          # digests land side by side instead of in separate downloadable logs.
          ZIGLIBS_LANE: ${{ matrix.name }}
          # Empty for every lane but one; the lane table says which peer and
          # why. `run_modules` prints a line whenever it honours this.
          ZIGLIBS_SKIP_LIVE: ${{ matrix.skip_live }}
        run: |
          # The imap peer is found at its default path; the opcua one is named
          # by an environment variable, so point it at the venv built above.
          # A path that does not exist is not a silent loss: test.sh probes it
          # and reports the gap — on the lanes that run tests. The compile-only
          # lane builds no venv and runs no probe, so on that one this line is
          # inert, not a safety net.
          export OPCUA_PYTHON="$HOME/.cache/zig-libs-opcua/bin/python3"
          bash scripts/test.sh ${{ matrix.cmd }} ${{ matrix.args }}
      - name: tc action tests, as real root
        # ⭐ THE LAST GAP, and the only one `unshare -rn` cannot close.
        # RTM_NEWACTION checks CAP_NET_ADMIN against the INITIAL user namespace,
        # so the sysctl that fixed every other netns module here does nothing
        # for this one — no amount of userns permission substitutes for real
        # root. scripts/test.sh therefore only PRINTS this command.
        #
        # That refusal is right on a development machine: `zig build` executes
        # build.zig, which is arbitrary code, so a NOPASSWD rule for it would be
        # passwordless root rather than a narrow grant. A hosted runner is a
        # different machine — ephemeral, already executing this repository's
        # code, discarded when the job ends — so the reasoning does not carry
        # over, and the coverage is taken here instead of written off forever.
        #
        # ⚠ SEPARATE CACHE DIRECTORIES, not tidiness. Building as root into the
        # job's own `.zig-cache` leaves root-owned entries that `actions/cache`
        # would then save, and the next run could not write them.
        #
        # ⚠ This has never run anywhere. If it goes red, that is a finding about
        # tc, not about this step — those tests have been skipping since the
        # module was written.
        #
        # ⭐ `--summary all`, and it is the whole point of the step rather than
        # decoration. Its first run anywhere, on tag 2026-08-15, printed NOT ONE
        # LINE in thirty-five seconds and exited 0 — which is what `zig build`
        # does on success, and which is indistinguishable from the tests
        # skipping exactly as they always had. A step that exists to close a
        # coverage gap and cannot say whether it closed it is the same fail-open
        # shape it was written to fix.
        # Only where module TESTS run. The examples and checks lanes have no
        # business paying for a root netns they never enter.
        if: matrix.tc && env.ZIGLIBS_DRY_RUN != '1'
        # ⚠ THE ONE `zig build` IN THIS FILE THAT IS NOT MEMORY-CAPPED, and as
        # of 2026-09-09 that is DECIDED rather than outstanding. `scripts/lib/capped`
        # exists to stop a runaway build from taking down a DEVELOPER DESKTOP:
        # 15.67 GB of unbounded `zig test` once did exactly that here, and the
        # kernel picks its victim by `oom_score_adj`, so the process that dies
        # is never the one that filled memory. None of that applies to a
        # GitHub-hosted runner. It is a disposable VM with nothing else on it;
        # an OOM there kills the job and prints so, which is an ordinary red CI
        # run, not a lost editor.
        #
        # The mechanical obstacle is real too and worth keeping written down:
        # `capped` wraps a command in `systemd-run --user --scope`, and under
        # `sudo` that targets root's user manager, which normally does not
        # exist — so `capped` here would silently degrade to a bare `exec` and
        # buy a false sense of a bound. That is the worse outcome, and it is why
        # a plausible-but-unexercised root-side variant was not merged.
        # `scripts/check-apps.sh`, the other uncapped site the same audit found,
        # IS capped and the cap was proved to bound by killing a 3.2 GB
        # allocator at a 256 MB limit — the cap matters there because that one
        # runs on the desktop.
        #
        # ⚠ SECOND ISSUE AT THIS SITE, decided the same way: the two
        # `--cache-dir` paths point into `/tmp`. `scripts/test.sh` redirects
        # `TMPDIR` off tmpfs because a multi-gigabyte build cache in RAM once
        # OOM-killed a desktop here. Same reasoning — that hazard is about this
        # machine's memory, and the alternative (a root-owned cache inside the
        # checkout) leaves permission debris in a working tree that outlives the
        # job. On a throwaway runner the cache dies with the VM either way.
        run: |
          sudo unshare -n "$(command -v zig)" build test-tc ${{ matrix.args }} \
            --summary all \
            --cache-dir /tmp/zig-cache-root --global-cache-dir /tmp/zig-gcache-root
      # After the root `tc` step, so a lane whose tc root tests fail keeps
      # nothing. Only a green run gets here, and only a push, tag or dispatch shares
      # what it proved; a pull request's stamps would be discarded by the
      # fetch anyway, so it does not upload them.
      - name: Keep this lane's stamps
        if: success() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ZIGLIBS_DRY_RUN == '1' && 'dry-' || '' }}stamps-full-${{ matrix.cachekey }}-${{ runner.arch }}
          path: ${{ runner.temp }}/stamps/stamps.tsv
          if-no-files-found: ignore
      - name: Report the cache footprint and what this runner is
        # The number the cache decision has never had. Whether five lanes fit
        # under a 10 GB repository quota is arithmetic, and until this line
        # existed the only figure anyone had was the DEVELOPMENT tree's — which
        # accumulates every optimize mode across every run ever made and so
        # describes a different object entirely.
        #
        # `if: always()` because a RED lane's footprint is worth just as much:
        # actions/cache will not save it, and knowing the size anyway is how a
        # permanently cold lane gets explained rather than guessed at.
        #
        # ⭐ AND THE KERNEL, CPU AND RESOLVED ZIG TARGET, which is how the cache
        # question got answered — by refuting the explanation these lines were
        # added to support.
        #
        # The first warm run split the lanes in two: arm64 restored, rebuilt the
        # one module that had changed, and finished its compile in 42 s, while
        # both amd64 lanes restored a cache of the same size and then recompiled
        # essentially everything. The explanation offered was that `native` is
        # not one thing — `zig env` resolves it to a kernel version range, a
        # glibc version and a detected CPU, all of which feed Zig's own cache key
        # — and that GitHub's amd64 pool is heterogeneous where its arm64 pool is
        # not. Plausible, and wrong.
        #
        # These three lines said so on their first run. Both amd64 lanes reported
        # Linux 7.0.0-1011-azure, an AMD EPYC 7763 and
        # x86_64-linux.7.0...7.0-gnu.2.43 — identical in every respect — and one
        # of them compiled in 91 s while the other took 2540 s. Nothing about the
        # machine differed. What differed was which cache entry each restored,
        # and that is a prefix-matching bug in the keys above, fixed there.
        #
        # Keep printing them. They cost nothing, they are what turned a confident
        # story into a measurement, and the next surprise will want the same
        # three facts about the machine that produced it.
        if: always()
        run: |
          du -sh "$GITHUB_WORKSPACE/.zig-cache" 2>/dev/null || echo "no .zig-cache"
          du -sh "$GITHUB_WORKSPACE/.zig-cache/o" 2>/dev/null || true
          echo "kernel:     $(uname -srm)"
          # aarch64 /proc/cpuinfo has no "model name" line at all — it carries
          # "CPU implementer"/"CPU part" instead — so the first run of this
          # printed an empty CPU for the one lane whose hardware differs.
          #
          # ⚠ Tested on emptiness, NOT on the pipeline's exit status: `grep |
          # cut | xargs` exits 0 even when grep matched nothing, because the
          # status belongs to xargs. A `||` fallback there would never fire.
          cpu="$(grep -m1 -E 'model name|Model name' /proc/cpuinfo 2>/dev/null | cut -d: -f2- | xargs)"
          [ -n "$cpu" ] || cpu="$(grep -m1 'CPU part' /proc/cpuinfo 2>/dev/null | cut -d: -f2- | xargs)"
          echo "cpu:        ${cpu:-unknown}"
          echo "zig target: $(zig env 2>/dev/null | grep -m1 '\.target' | cut -d'"' -f2 || echo unknown)"

  # ⭐ THE ONE CHECK WHOSE GREEN MEANS SOMETHING.
  #
  # A green tick on GitHub does not say the gate ran. A SKIPPED job also shows
  # as a tick, and the two shapes here exclude each other by design — `scoped`
  # is skipped on tags, `full` is skipped everywhere else — so on any given ref
  # roughly half the ticks are for work that never happened. Reading the run
  # therefore meant knowing which jobs were supposed to run, which is exactly
  # the knowledge a status check exists to spare its reader.
  #
  # So one job asserts the rule instead of leaving it implicit: on a tag, `full`
  # passed and `scoped` did not run; on anything else, the reverse. It fails on
  # `skipped` as loudly as on `failure`, because "did not run" and "ran and
  # broke" are the same answer to "is this commit gated".
  #
  # Written down here, the rule can be argued with. Left implicit, it could only
  # be misread. Borrowed from vercel-labs/native, which keeps a stable
  # required-check name the same way.
  #
  # ⚠ THE GAP THIS USED TO CARRY IS CLOSED UPSTREAM OF HERE, and the fix is not
  # in this job. A `scoped` run that detected a harness change used to print
  # "this is NOT the gate", run a two-module smoke set, and exit 0 — `success`,
  # and this job was happy. It happened for real on `eef1e28`, which changed
  # 191 lines of opcua's driver and never built the module.
  #
  # Since 2026-09-18 the shape cannot occur for a different reason: modules are
  # chosen by stamps, not by the diff, and opcua's own files moving re-keys it,
  # so a harness change runs the smoke set AND every re-keyed module. The fix is
  # still in the driver, not here: this job reads job RESULTS, and "ran less
  # than it should have" is not visible in a result.
  # ⭐ BLOCKING, and its own job rather than a step inside a `full` lane.
  #
  # Blocking because a lane whose red light cannot fail a commit is a lane whose
  # verdict nobody has to read. It was non-blocking while the package-manager
  # path was new; it is the only check that compiles the published API the way a
  # stranger reaches it, which is exactly the reason to let it speak.
  #
  # Its own job, because folding it into `modules ReleaseSafe amd64` would be a
  # THIRD compile of the same modules inside that lane. Zig's unit of caching is
  # the whole binary, so a module already compiles twice per lane — once into the
  # test binary, once into its example — and an app built through the package
  # manager shares a cache with neither. `ReleaseFast` cleared the 90-minute cap
  # by 23 seconds; this would not fit, and it does not need to. Here it runs on
  # its own runner, in parallel, holding nobody up.
  #
  # Cost, measured on the development host: five apps built and their smoke
  # tests run in BOTH ReleaseSafe and ReleaseFast is ~37 s wall — the smokes
  # dominate now, not the builds (raft-kv's no-majority case alone holds a 4 s
  # client budget per mode). ⚠ That is with builds already cached and a warm
  # global cache; a runner has neither, so it is a floor, not the lane's cost.
  # (An earlier version of this comment quoted ~4 s — measured before the apps
  # were fixed to stop building in Debug, which is what that number was really
  # timing.)
  consumer:
    name: consumer build
    # No `needs`: this job shares nothing with scoped/full/plan (its own
    # checkout, its own toolchain, no matrix input) and the comment above says
    # it "holds nobody up." A `needs` on them would make GitHub wait for the
    # full matrix — up to a 90-minute lane — before starting ~37 s of work, the
    # opposite of parallel. `gate` lists `consumer` in ITS needs, so nothing is
    # lost by consumer starting immediately.
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      # Builds every example-apps/ project against THIS commit, through the
      # package machinery rather than an in-repo addImport. An app's source is
      # written against the tree, so the pin is never what fails here: red means
      # this commit broke a published API, and a consumer would meet it one
      # release later.
      #
      # ⭐ `--run` then RUNS each app: sockets, key files, HTTP requests, a
      # three-process MLS session. Compiling an app proves that its imports
      # resolve, which is the smaller half. The gate over `modules/<m>/example/`
      # was compile-only too, and the day it started running them one pass found
      # 22 that did not work.
      #
      # ⭐ And it runs each app TWICE, ReleaseSafe then ReleaseFast, because
      # `std.debug.assert` is compiled out of the latter: a fail-open guard is
      # invisible in every safe-mode run and only lets the bad thing through in
      # the mode a consumer is most likely to build. This repository has shipped
      # exactly that defect.
      - name: example-apps built and run against this commit
        if: env.ZIGLIBS_DRY_RUN != '1'
        run: bash scripts/check-apps.sh --run
      # ⭐ THE DOWNLOADER'S PATH, and it exists only on a tag ref.
      #
      # The step above substitutes the working tree for the pinned dependency,
      # so it never goes through `.paths` and never verifies a hash. This one
      # builds the manifest as written — fetch by URL and hash, compile the
      # exported package — which is what a person who downloads one directory
      # gets. `check-package` covers LICENSE and NOTICE by name and nothing
      # else, and the package having shipped without either is why it exists; a
      # module directory dropped from `.paths` would still be invisible.
      #
      # Only on a tag, because only there do the pin and the commit under test
      # name the same content. Off a tag this would compare two versions — a
      # check this repository deliberately does not make (see
      # example-apps/README.md, "The check that is deliberately absent").
      # `--pinned` proves that condition itself and refuses otherwise, so this
      # `if` and the script agree or the job goes red rather than vacuous.
      - name: example-apps through their pins (tag refs only)
        if: startsWith(github.ref, 'refs/tags/') && env.ZIGLIBS_DRY_RUN != '1'
        run: bash scripts/check-apps.sh --pinned

  gate:
    name: gate
    if: always()
    # `plan` is here only for its `selected` output — the gate reads no result
    # from it. A failed `plan` is still caught, because `full` is then skipped.
    #
    # `consumer` IS read, and unlike the two shapes it must have run on every
    # ref: it is not part of the either/or, so `skipped` is a failure here just
    # as `failure` is.
    needs: [scoped, full, plan, consumer]
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Exactly one shape must have run, and it must have passed
        env:
          SCOPED: ${{ needs.scoped.result }}
          FULL: ${{ needs.full.result }}
          IS_TAG: ${{ startsWith(github.ref, 'refs/tags/') }}
          # ⚠ A DISPATCH RUNS THE FULL SHAPE, and the gate must expect that or it
          # would demand `scoped` on a run where `scoped` is correctly idle.
          IS_DISPATCH: ${{ github.event_name == 'workflow_dispatch' }}
          SELECTED: ${{ needs.plan.outputs.selected }}
          CONSUMER: ${{ needs.consumer.result }}
        run: |
          echo "scoped=$SCOPED  full=$FULL  consumer=$CONSUMER  tag=$IS_TAG  dispatch=$IS_DISPATCH"
          if [ "${ZIGLIBS_DRY_RUN:-0}" = 1 ]; then
            echo "::warning::DRY RUN -- nothing was compiled or tested. This result is about the pipeline, not the code."
          fi
          if [ "$IS_TAG" = true ] || [ "$IS_DISPATCH" = true ]; then
            ran_name=full;   ran=$FULL;   idle_name=scoped; idle=$SCOPED
          else
            ran_name=scoped; ran=$SCOPED; idle_name=full;   idle=$FULL
          fi
          rc=0
          if [ "$ran" != success ]; then
            echo "::error::$ran_name is '$ran', not success — this commit is NOT gated"
            rc=1
          fi
          # A shape that ran when it should not have means the routing above is
          # wrong, and a gate whose own routing is wrong cannot vouch for
          # anything it reports.
          if [ "$idle" != skipped ]; then
            echo "::error::$idle_name is '$idle' — it should not have run on this ref at all"
            rc=1
          fi
          # `consumer` is outside the either/or: it runs on every ref, so
          # anything but success — including `skipped`, which is what a job that
          # never started reports — leaves the published API unbuilt by the one
          # check that reaches it through the package manager.
          if [ "$CONSUMER" != success ]; then
            echo "::error::consumer is '$CONSUMER', not success — example-apps did not build against this commit"
            rc=1
          fi
          if [ "$rc" -eq 0 ]; then
            echo "gate: $ran_name passed, $idle_name correctly did not run, consumer passed"
          fi
          # ⚠ AND A GREEN DISPATCH IS NOT WHAT A GREEN TAG IS. It may have run a
          # single lane, over a branch that is not main. Said here because this
          # job's tick is the one thing anyone reads, and the two ticks look
          # identical.
          if [ "$IS_DISPATCH" = true ]; then
            echo "note: manual run, lanes = ${SELECTED:-unknown}. This is NOT a"
            echo "      full-matrix claim unless every lane was selected."
          fi
          exit "$rc"
