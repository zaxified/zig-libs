name: CI

on:
  push:
    branches: [main]
    # Date tags (see CONVENTIONS §8). A tag is a claim that every lane was
    # green at that commit, so tagging re-runs the full matrix rather than
    # trusting that main was green when the tag was cut.
    tags: ["20[0-9][0-9]-[0-9][0-9]-[0-9][0-9]"]
  pull_request:

# Linux-only: several modules (procnet, rawsock, netlink, wireguard, …) are
# raw-syscall Linux members and are compiled by `zig build test`; socket/netns
# tests SkipZigTest cleanly on a constrained runner.
#
# TWO SHAPES, and the split is the point.
#
#   pull_request        -> `test.sh changed`, one lane. Tests the modules the
#                          branch touched plus their reverse-dependency
#                          closure, computed from `zig build module-graph`.
#   push to main / tag  -> `test.sh all`, three optimize lanes.
#
# WHY SCOPING IS SOUND, rather than merely cheaper. The driver decides the
# escalation from the GRAPH, not from which file was edited: it keeps a
# snapshot of the last known-good `module-graph` and, if any row is missing or
# altered — a module changed shape or vanished — the reverse-dep closure can no
# longer be trusted and it runs everything. With no snapshot at all it also
# runs everything. Both failure directions are fail-closed, which is what makes
# this safe to put in front of merges.
#
# Measured 2026-08-12 on the real graph: the closure is a MEDIAN OF 1 module
# (147 of 224 modules have no in-repo consumer at all), 6 at the 90th
# percentile, 61 at worst (`testkit`). A leaf change costs ~5 s against ~540 s
# for the full gate.
#
# THREE LANES, and the fourth was dropped on 2026-08-12 with a reason rather
# than a preference. `heavy_optimize` in build.zig substitutes ReleaseSafe for
# Debug on the heavy modules, which makes the old default lane's every
# (module, mode) pair a SUBSET of strict-debug's and ReleaseSafe's — it had no
# combination of its own to prove. Locally that overlap makes it nearly free to
# run after those two, since its artifacts are already built; here, where every
# lane is a separate job with its own cache, it was paying a full build for
# coverage that was already bought.
#
# The three that remain share nothing: each names one mode for every module, so
# no ordering saves a compile. They run in parallel anyway.
#
# THE LANES THEMSELVES are deliberate. Compute-heavy modules build at ReleaseSafe when
# Debug is requested (see `heavy` in build.zig — it takes bls12_381 from 182s to
# 5s and it is the suite's critical path). `-Dstrict-debug` forces it back, keeping
# CONVENTIONS §6.4's "green in Debug and ReleaseFast" honest. Integrators build
# in all three release modes; ReleaseSafe was the only one no lane covered — and
# it earned its place on 2026-08-12 by being the only lane that caught a
# use-after-scope in http's response path that every other lane passed by luck
# (see `ResponseWriter.header_buf`).
#
# They run as separate jobs so the slow one does not gate the fast one.
#
# ⚠ CACHE KEYS ARE NOT OPTIONAL HERE. `setup-zig` preserves the Zig cache
# between runs, but it cannot tell one matrix job from another on its own — its
# own README says to populate `cache-key` with the matrix variables. Without
# that, the lanes shared a single key and clobbered each other's cache
# every run, so every lane was effectively cold. The default 2 GiB
# `cache-size-limit` compounded it; this repo's cache runs to tens of GiB
# locally, so the action was also discarding the cache almost every time.
jobs:
  scoped:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    name: changed modules + reverse-dep closure
    steps:
      # Full history: `test.sh changed <base>` diffs against the base branch,
      # and a shallow clone has nothing to diff against.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
          cache-key: scoped
          cache-size-limit: 8192
      - name: Test changed modules
        run: bash scripts/test.sh changed "origin/${{ github.base_ref }}"

  full:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ReleaseSafe
            args: "-Doptimize=ReleaseSafe"
          - name: ReleaseFast
            args: "-Doptimize=ReleaseFast"
          - name: strict Debug
            args: "-Dstrict-debug"
    name: full — ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
          # One cache per lane. Distinct optimize modes cannot share an entry.
          cache-key: full-${{ matrix.name }}
          cache-size-limit: 8192
      # scripts/test.sh all runs the format check, the hook self-test, the
      # catalog/provenance gates and every module, and wraps the
      # netlink-writing modules in `unshare -rn` where the runner allows it —
      # otherwise those tests skip rather than fight the runner's own network
      # state. It also prints a capability report naming anything the runner
      # cannot do, so a lane that silently covers less than it looks like is
      # visible in the log.
      #
      # ⚠ NO RELIABLE WALL-CLOCK FIGURE IS RECORDED HERE ON PURPOSE. Every
      # local measurement taken on 2026-08-12 was confounded by cache state:
      # ReleaseSafe 587 s warm, ReleaseFast 2053 s cold, strict Debug 1091 s
      # in between. Those numbers cannot be compared with each other, and the
      # figure this file carried before them (~1170 s) had never been
      # rechecked at all. A CI run with per-lane caches is the first honest
      # measurement; take it from there rather than from a comment.
      - name: Test (${{ matrix.name }})
        run: bash scripts/test.sh all ${{ matrix.args }}
