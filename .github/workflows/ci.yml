name: CI

on:
  push:
    branches: [main]
  pull_request:

# Linux-only: several modules (procnet, rawsock, netlink, wireguard, …) are
# raw-syscall Linux members and are compiled by `zig build test`; socket/netns
# tests SkipZigTest cleanly on a constrained runner.
#
# The three optimisation lanes are deliberate. Compute-heavy modules build at
# ReleaseSafe when Debug is requested (see `heavy` in build.zig — it takes
# bls12_381 from 182s to 5s and it is the suite's critical path), so the plain
# lane no longer proves anything about real Debug. `-Dstrict-debug` forces it
# back, keeping CONVENTIONS §6.4's "green in Debug and ReleaseFast" honest.
# They run as separate jobs so the slow one does not gate the fast one.
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: default (heavy modules at ReleaseSafe)
            args: ""
          - name: strict Debug
            args: "-Dstrict-debug"
          - name: ReleaseFast
            args: "-Doptimize=ReleaseFast"
          # Integrators build in all three release modes; ReleaseSafe was the
          # only one no lane covered. See CONVENTIONS.md 7.1.
          # Slowest lane by a wide margin — ~1170s locally cold vs ~680s for
          # strict Debug and ~360s for the default, so it sets the wall clock.
          - name: ReleaseSafe
            args: "-Doptimize=ReleaseSafe"
    name: test — ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      # scripts/test.sh all runs the format check, the catalog gate and every
      # module, and wraps the netlink-writing modules in `unshare -rn` where
      # the runner allows it — otherwise those tests skip rather than fight
      # the runner's own network state. It also prints a capability report
      # naming anything the runner cannot do, so a lane that silently covers
      # less than it looks like is visible in the log.
      - name: Test (${{ matrix.name }})
        run: bash scripts/test.sh all ${{ matrix.args }}
