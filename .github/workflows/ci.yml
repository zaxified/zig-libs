name: CI

on:
  push:
    branches: [main]
    # Date tags (see CONVENTIONS §8). A tag is a claim that every lane was
    # green at that commit, so tagging re-runs the full matrix rather than
    # trusting that main was green when the tag was cut.
    tags: ["20[0-9][0-9]-[0-9][0-9]-[0-9][0-9]"]
  pull_request:

# Linux-only: several modules (procnet, rawsock, netlink, wireguard, …) are
# raw-syscall Linux members and are compiled by `zig build test`; socket/netns
# tests SkipZigTest cleanly on a constrained runner.
#
# TWO ARCHITECTURES, because the README makes a claim only a second one can
# check. 191 of its 225 catalog rows say Platform `any`, and a consumer reading
# that is entitled to build on aarch64. Until 2026-08-14 every lane ran on
# amd64, so `any` was a claim no job had ever tested.
#
# Three modules make it concrete rather than theoretical. `montint`, `k256` and
# `p256` gate their asm fast path on `builtin.cpu.arch == .x86_64` (see
# `asm_core.zig` / `fast_core.zig`: `pub const supported = ...`), and each
# advertises "amd64 asm + portable fallback". On an amd64 runner the dispatch
# never selects the fallback, so the path every non-amd64 consumer would run was
# the one path no lane exercised.
#
# NOT to be confused with the arm64 question closed on 2026-08-09 (`86cb149`),
# which was about PERFORMANCE -- whether `lockfree`'s seq_cst discipline costs
# anything a weaker ordering would recover. That was answered by measurement on
# TSO and needed no hardware. Portability is a different question and hardware
# is the only thing that answers it.
#
# TWO SHAPES, and the split is the point.
#
#   pull_request        -> `test.sh changed`, one lane. Tests the modules the
#                          branch touched plus their reverse-dependency
#                          closure, computed from `zig build module-graph`.
#   push to main / tag  -> `test.sh all`, three optimize lanes.
#
# WHY SCOPING IS SOUND, rather than merely cheaper. The driver decides the
# escalation from the GRAPH, not from which file was edited: it keeps a
# snapshot of the last known-good `module-graph` and, if any row is missing or
# altered — a module changed shape or vanished — the reverse-dep closure can no
# longer be trusted and it runs everything. With no snapshot at all it also
# runs everything. Both failure directions are fail-closed, which is what makes
# this safe to put in front of merges.
#
# The shape of the win, measured on the real graph 2026-08-12: the closure is a
# MEDIAN OF ONE MODULE, because most modules have no in-repo consumer at all. It
# reaches a few at the 90th percentile and a few dozen at its worst (`testkit`,
# which half the suite imports). A leaf change therefore costs a small multiple
# of one module's tests against the whole suite.
#
# THREE LANES, and the fourth was dropped on 2026-08-12 with a reason rather
# than a preference. `heavy_optimize` in build.zig substitutes ReleaseSafe for
# Debug on the heavy modules, which makes the old default lane's every
# (module, mode) pair a SUBSET of strict-debug's and ReleaseSafe's — it had no
# combination of its own to prove. Locally that overlap makes it nearly free to
# run after those two, since its artifacts are already built; here, where every
# lane is a separate job with its own cache, it was paying a full build for
# coverage that was already bought.
#
# The three that remain share nothing: each names one mode for every module, so
# no ordering saves a compile. They run in parallel anyway.
#
# THE LANES THEMSELVES are deliberate. Compute-heavy modules build at ReleaseSafe
# when Debug is requested (see `heavy` in build.zig — it takes `bls12_381`, the
# suite's critical path, from minutes to seconds). `-Dstrict-debug` forces it back, keeping
# CONVENTIONS §6.4's "green in Debug and ReleaseFast" honest. Integrators build
# in all three release modes; ReleaseSafe was the only one no lane covered — and
# it earned its place on 2026-08-12 by being the only lane that caught a
# use-after-scope in http's response path that every other lane passed by luck
# (see `ResponseWriter.header_buf`).
#
# They run as separate jobs so the slow one does not gate the fast one.
#
# ⚠ ONLY THE PR LANE IS CACHED, and the arithmetic is why. GitHub allows 10 GB
# of Actions cache PER REPOSITORY and evicts least-recently-used entries above
# it. This repo's own `.zig-cache` runs to tens of GiB, so a lane cannot hold a
# useful fraction of it and five lanes cannot hold one each: at the 8 GiB limit
# this file used to request for every job, the five together asked for four
# times the entire quota. They would have evicted each other on every run and
# all five would have been cold — the same outcome as the shared-`cache-key`
# bug this file already records fixing, reached by a different route.
#
# So the cache goes where a cold build actually costs someone waiting: the PR
# lane, which runs on every push to a branch and normally builds a closure of
# one module. The `full` lanes run on merges to main and on tags, are already
# parallel, and nobody is watching them. A cold full lane costs wall-clock that
# is not on anyone's critical path; a thrashing cache costs the same wall-clock
# AND the pretence of being warm.
#
# `cache-key` still names the lane. It is load-bearing whenever more than one
# job caches: `setup-zig` cannot tell matrix jobs apart on its own, and without
# it the lanes shared one entry and clobbered it every run.
jobs:
  scoped:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    name: changed modules + reverse-dep closure
    steps:
      # Full history: `test.sh changed <base>` diffs against the base branch,
      # and a shallow clone has nothing to diff against.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
          cache-key: scoped
          # Under the 10 GB repository quota with room for the entry to grow
          # rather than be evicted the moment it does.
          cache-size-limit: 6144
      - name: Test changed modules
        run: bash scripts/test.sh changed "origin/${{ github.base_ref }}"

  full:
    if: github.event_name == 'push'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ReleaseSafe
            args: "-Doptimize=ReleaseSafe"
            runner: ubuntu-latest
          - name: ReleaseFast
            args: "-Doptimize=ReleaseFast"
            runner: ubuntu-latest
          - name: strict Debug
            args: "-Dstrict-debug"
            runner: ubuntu-latest
          # ONE arm64 lane, not three. What a second architecture buys is
          # portability coverage -- alignment and endianness assumptions, atomics,
          # and the asm-vs-fallback dispatch above -- and none of that varies by
          # optimize mode, so the other two would mostly recompile the same
          # surface. ReleaseSafe is the mode chosen because it is the one that has
          # already caught a real defect here (see below). The day this lane fails
          # something the amd64 ReleaseSafe lane passes, add the other two rather
          # than arguing about it.
          - name: ReleaseSafe arm64
            args: "-Doptimize=ReleaseSafe"
            runner: ubuntu-24.04-arm
    name: full — ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
          # Deliberately uncached — see the note above. Four lanes cannot each
          # hold a useful slice of a 10 GB quota, and a cache that is evicted
          # before it is reused is worse than none: it reads as warm.
          use-cache: false
      # scripts/test.sh all runs the format check, the hook self-test, the
      # catalog/provenance gates and every module, and wraps the
      # netlink-writing modules in `unshare -rn` where the runner allows it —
      # otherwise those tests skip rather than fight the runner's own network
      # state. It also prints a capability report naming anything the runner
      # cannot do, so a lane that silently covers less than it looks like is
      # visible in the log.
      #
      # ⚠ NO WALL-CLOCK FIGURE BELONGS IN THIS FILE. Not "none is known yet" —
      # none belongs. A duration here is a number nobody re-measures and every
      # reader believes: this file carried a ~1170 s figure that had never been
      # rechecked, and the three that briefly replaced it were confounded by
      # cache state and could not be compared with each other anyway. The run
      # log is the measurement, it is per-lane and dated, and it costs nothing
      # to look at. Read it there.
      - name: Test (${{ matrix.name }})
        run: bash scripts/test.sh all ${{ matrix.args }}
