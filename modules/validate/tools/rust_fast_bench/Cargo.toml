[package]
name = "validate_fast_bench"
version = "0.1.0"
edition = "2021"
publish = false

# "Fastest in the field" side of `zig build bench-validate`
# (modules/validate/tools/bench.zig): jprochazk/garde and Keats/validator,
# pinned exactly. garde without the unicode/phone/card extras (its `email`
# feature brings regex, `url` the url crate), validator with `derive`.
[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_derive = "=1.0.229"
serde_json = "=1.0.154"
garde = { version = "=0.23.0", default-features = false, features = ["derive", "email", "url"] }
validator = { version = "=0.21.0", features = ["derive"] }

[profile.release]
lto = true
codegen-units = 1

# Not part of any enclosing Cargo workspace.
[workspace]
