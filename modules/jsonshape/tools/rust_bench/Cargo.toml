[package]
name = "jsonshape_rust_bench"
version = "0.0.0"
edition = "2021"
publish = false

[[bin]]
name = "jsonshape_rust_bench"
path = "src/main.rs"

[dependencies]
serde_json = "=1.0.154"
serde_json_path = "=0.7.2"
jsonpath-rust = "=1.0.12"

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3
panic = "abort"

[workspace]
