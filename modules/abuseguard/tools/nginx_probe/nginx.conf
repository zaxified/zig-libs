# Scratch nginx for probe.py: daemon off, one process, loopback only; paths are relative to the -p prefix.
daemon off;
master_process off;
worker_processes 1;
error_log logs/error.log info;
pid logs/nginx.pid;
events { worker_connections 256; }
http {
    access_log logs/access.log;
    client_body_temp_path tmp; proxy_temp_path tmp; fastcgi_temp_path tmp; uwsgi_temp_path tmp; scgi_temp_path tmp;
    limit_conn_zone $binary_remote_addr zone=perip:1m;
    server {
        listen 127.0.0.1:18431;
        root html;
        client_header_timeout 60s;
        limit_conn perip 1;
        location /big { limit_rate 100k; }
    }
}
