[package]
name = "rust_bench"
version = "0.1.0"
edition = "2021"
publish = false

# Candidate side of `zig build bench-decimal` (modules/decimal/tools/bench.zig):
# rust_decimal 1.42.1 (MIT), pinned exactly, default features off.
[dependencies]
rust_decimal = { version = "=1.42.1", default-features = false, features = ["std"] }

[profile.release]
lto = true
codegen-units = 1

# Not part of any enclosing Cargo workspace.
[workspace]
