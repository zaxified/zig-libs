[package]
name = "json5_rs_field"
version = "0.1.0"
edition = "2021"
publish = false

# "Fastest in the field" side of `zig build bench-json5`
# (modules/json5/tools/bench.zig), and the lead probe behind the card's
# `**Ahead:**` correctness line (src/bin/lead.rs): the two Rust JSON5 crates,
# pinned exactly, read into serde_json::Value.
[dependencies]
json5 = "=1.3.1"
json-five = "=0.3.1"
serde_json = "=1.0.154"

[profile.release]
lto = true
codegen-units = 1

# Not part of any enclosing Cargo workspace.
[workspace]
