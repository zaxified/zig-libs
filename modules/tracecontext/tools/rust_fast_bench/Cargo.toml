[package]
name = "tracecontext_fast_bench"
version = "0.1.0"
edition = "2021"
publish = false

# "Fastest in the field" side of `zig build bench-tracecontext`
# (modules/tracecontext/tools/bench.zig): OpenTelemetry Rust's W3C
# `TraceContextPropagator`, pinned exactly, no default features (no async
# runtime); httparse stands in for Go's http.ReadRequest.
[dependencies]
opentelemetry = { version = "=0.33.1", default-features = false, features = ["trace"] }
opentelemetry_sdk = { version = "=0.33.1", default-features = false, features = ["trace"] }
http = "=1.5.0"
httparse = "=1.10.1"

[profile.release]
lto = true
codegen-units = 1

# Not part of any enclosing Cargo workspace.
[workspace]
