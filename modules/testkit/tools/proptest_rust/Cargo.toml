[package]
name = "proptest_bench"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
# std only: no `fork`/`timeout` (rusty-fork, wait-timeout), no regex
# strategies -- the bench drives a byte-vector strategy in-process.
proptest = { version = "=1.11.0", default-features = false, features = ["std"] }

[profile.release]
lto = true
codegen-units = 1
