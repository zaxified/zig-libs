[package]
name = "mls-oracle"
version = "0.1.0"
edition = "2021"
publish = false

# Foreign side of `zig build bench-mls` (modules/mls/tools/bench.zig):
# OpenMLS (MIT), the card's reference, with its RustCrypto provider and basic
# credentials. Cargo.lock pins the whole graph.
[dependencies]
openmls = { version = "=0.9.0" }
openmls_rust_crypto = "=0.6.0"
openmls_basic_credential = "=0.6.0"
tls_codec = "=0.5.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

# Not part of any enclosing Cargo workspace.
[workspace]
