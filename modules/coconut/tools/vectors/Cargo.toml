[package]
name = "coconut_vectors"
version = "0.1.0"
edition = "2021"

[dependencies]
coconut-crypto = { version = "=0.14.0", default-features = false, features = ["std"] }
ark-bls12-381 = { version = "0.4", default-features = false, features = ["curve"] }
ark-ec = { version = "0.4", default-features = false }
ark-ff = { version = "0.4", default-features = false }
ark-serialize = { version = "0.4", default-features = false }
ark-std = { version = "0.4", default-features = false, features = ["std"] }
blake2 = { version = "0.10", default-features = false }
